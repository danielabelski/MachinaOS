# Dependabot policy: SECURITY UPDATES ONLY.
#
# Version-update PRs are deliberately disabled (open-pull-requests-limit: 0).
# History: weekly version bumps produced 12-26 PRs/week, ~89% closed unmerged
# (105 PRs May-Aug 2026; see docs-internal/ci_cd.md "Dependency update
# policy"). Dependencies move deliberately, alongside test runs - not
# piecemeal. Security PRs are NOT affected by the limit or the schedule:
# they open as soon as a fixable vulnerability is disclosed.
#
# Do not "fix" the 0 limits without reading the ci_cd.md section first.
version: 2
updates:
  # bun - the root bun workspace covers package.json, client/, and
  # server/nodejs/ through the single bun.lock. (A former `/server`
  # entry pointed at a manifest deleted in d0e1b816 and was removed.)
  # NOTE: the bun ecosystem supports version updates only - Dependabot
  # does NOT open security-update PRs for bun.lock (alerts still fire
  # from the dependency graph). The top-level `overrides` block in
  # package.json is this repo's actual security-pin remediation channel.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      bun-security:
        applies-to: security-updates
        patterns: ["*"]

  # pip - the server runtime. Authoritative manifest: server/pyproject.toml;
  # the committed requirements.txt (a `uv export` of the transitive tree)
  # doubles as the pinned surface security updates can patch. (A former root
  # `pip: /` entry never updated the root CLI pyproject - its >= floors need
  # no PRs - and only re-bumped server/requirements.txt, duplicating this
  # entry's PRs; it was removed.)
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      pip-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
